name: Reusable python check

on:
  workflow_call:
    inputs: 
      python-version:
        description: "Python version to test againts"
        required: false
        type: string
        default: "3.12"
      run-lint:
        description: "Whether to call the linter"
        required: false
        type: boolean
        default: true
    outputs:
      version:
        description: "Version derived from git describe"
        value: ${{ jobs.checks.outputs.version }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.describe.output.version }}

    steps:
      - name: Check this out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup python version
        uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}

      - name: install
        run: pip install -e ".[dev]"

      - name: lint
        if: ${{ inputs.run-lint }}
        run: |
          pip install ruff
          ruff check src tests

      - name: Test
        run: pytest -q

      - name: Derive version
        id: describe
        run: echo "version=$(git describe --tags --always)" >> "GITHUB_OUTPUT"