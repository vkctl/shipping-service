name: Docker

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  image:
    name: Build and push image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Derive versions
        id: version
        run: |
          set -euo pipefail

          DESCRIBE=$(git describe --tags --always --dirty 2>/dev/null || echo "")
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          if [ -z "$LAST_TAG" ]; then
            SHA=$(git rev-parse --short HEAD)
            PEP440="0.0.0.dev0+g${SHA}"
          elif git describe --tags --exact-match >/dev/null 2>&1; then
            PEP440="${LAST_TAG#v}"
          else
            BASE="${LAST_TAG#v}"
            MAJOR=${BASE%%.*}; REST=${BASE#*.}; MINOR=${REST%%.*}; PATCH=${REST#*.}
            DISTANCE=$(git rev-list "${LAST_TAG}..HEAD" --count)
            SHA=$(git rev-parse --short HEAD)
            PEP440="${MAJOR}.${MINOR}.$((PATCH + 1)).dev${DISTANCE}+g${SHA}"
          fi

          echo "describe=$DESCRIBE" >> "$GITHUB_OUTPUT"
          echo "pep440=$PEP440"     >> "$GITHUB_OUTPUT"

          {
            echo "### Versions"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| git describe | \`$DESCRIBE\` |"
            echo "| PEP 440 | \`$PEP440\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.pep440 }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: ${{ github.event_name != 'pull_request' }}
          sbom: ${{ github.event_name != 'pull_request' }}

      - name: Scan the image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign the image (keyless, via OIDC)
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          REPO_LOWER: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          set -euo pipefail
          IMAGE_LOWER=$(echo "$REPO_LOWER" | tr '[:upper:]' '[:lower:]')
          cosign sign --yes "${IMAGE_LOWER}@${DIGEST}"

      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Smoke test the image
        run: |
          set -euo pipefail
          IMAGE=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          docker run -d --name smoke -p 8000:8000 "$IMAGE"
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8000/health > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:8000/health
          echo
          curl -fsS -X POST http://localhost:8000/quote \
            -H 'Content-Type: application/json' \
            -d '{"weight_kg": 10, "tier": "express"}'
          echo
          docker rm -f smoke

      - name: Summarise
        run: |
          {
            echo "### Image"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"