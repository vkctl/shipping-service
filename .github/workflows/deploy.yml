name: Deploy

on:
  workflow_run:
    workflows: ["Docker"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_ref:
        description: "Tag or digest to deploy (sha-<commit>, 0.7.0, or sha256:...)"
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  resolve:
    name: Resolve image
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    outputs:
      image: ${{ steps.pick.outputs.image }}
    steps:
      - name: Pick the image reference
        id: pick
        run: |
          set -euo pipefail
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            REF="${{ inputs.image_ref }}"
          else
            REF="sha-${{ github.event.workflow_run.head_sha }}"
          fi
          case "$REF" in
            sha256:*) IMAGE="ghcr.io/${REPO_LOWER}@${REF}" ;;
            *)        IMAGE="ghcr.io/${REPO_LOWER}:${REF}" ;;
          esac
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          {
            echo "### Deploying"
            echo ""
            echo "\`$IMAGE\`"
          } >> "$GITHUB_STEP_SUMMARY"

  staging:
    name: Deploy to staging
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    environment:
      name: staging
      url: http://${{ vars.DEPLOY_HOST }}:8000/health
    steps:
      - uses: actions/checkout@v6

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          IMAGE: ${{ needs.resolve.outputs.image }}
        run: |
          set -euo pipefail
          scp -i ~/.ssh/deploy_key scripts/deploy.sh "$DEPLOY_USER@$DEPLOY_HOST:/home/$DEPLOY_USER/deploy.sh"
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            "IMAGE='$IMAGE' APP_ENVIRONMENT=staging HOST_PORT=8000 bash deploy.sh"

      - name: Smoke test staging
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          BODY=$(curl -fsS --retry 10 --retry-delay 2 --retry-all-errors "http://$DEPLOY_HOST:8000/health")
          echo "$BODY"
          echo "$BODY" | grep -q '"status":"ok"'
          curl -fsS -X POST "http://$DEPLOY_HOST:8000/quote" \
            -H 'Content-Type: application/json' \
            -d '{"weight_kg": 10, "tier": "express"}' | grep -q '"cost":150.0'

  production:
    name: Deploy to production
    needs: [resolve, staging]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: http://${{ vars.DEPLOY_HOST }}:9000/health
    steps:
      - uses: actions/checkout@v6

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Blue-green deploy
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          IMAGE: ${{ needs.resolve.outputs.image }}
        run: |
          set -euo pipefail
          scp -i ~/.ssh/deploy_key scripts/*.sh "$DEPLOY_USER@$DEPLOY_HOST:/home/$DEPLOY_USER/"
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            "IMAGE='$IMAGE' APP_ENVIRONMENT=production bash deploy-bluegreen.sh"

      - name: Smoke test production
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          BODY=$(curl -fsS --retry 10 --retry-delay 2 --retry-all-errors "http://$DEPLOY_HOST/health")
          echo "$BODY"
          echo "$BODY" | grep -q '"environment":"production"'

      - name: Record what shipped
        env:
          IMAGE: ${{ needs.resolve.outputs.image }}
        run: |
          {
            echo "### Shipped to production"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Image | \`$IMAGE\` |"
            echo "| Actor | ${{ github.actor }} |"
            echo "| Run | ${{ github.run_id }} |"
          } >> "$GITHUB_STEP_SUMMARY"