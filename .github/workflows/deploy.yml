name: Deploy

on:
  workflow_run:
    workflows: ["Docker"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_ref:
        description: "Tag or digest to deploy (sha-<commit>, 0.7.0, or sha256:...)"
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  resolve:
    name: Resolve image
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    outputs:
      image: ${{ steps.pick.outputs.image }}
    steps:
      - name: Pick the image reference
        id: pick
        run: |
          set -euo pipefail
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            REF="${{ inputs.image_ref }}"
          else
            REF="sha-${{ github.event.workflow_run.head_sha }}"
          fi
          case "$REF" in
            sha256:*) IMAGE="ghcr.io/${REPO_LOWER}@${REF}" ;;
            *)        IMAGE="ghcr.io/${REPO_LOWER}:${REF}" ;;
          esac
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          {
            echo "### Deploying"
            echo ""
            echo "\`$IMAGE\`"
          } >> "$GITHUB_STEP_SUMMARY"

  staging:
    name: Deploy to staging
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    environment:
      name: staging
      url: http://${{ vars.DEPLOY_HOST }}:8000/health
    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-deploy-staging-${{ github.run_id }}

      - name: Find the staging instance by tag
        id: target
        run: |
          set -euo pipefail
          ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Project,Values=shipping-service" \
                      "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)
          if [ "$ID" = "None" ] || [ -z "$ID" ]; then
            echo "::error::No running staging instance found"
            exit 1
          fi
          echo "instance_id=$ID" >> "$GITHUB_OUTPUT"
          echo "Target staging instance: $ID"

      - name: Deploy over SSM
        env:
          IMAGE: ${{ needs.resolve.outputs.image }}
          INSTANCE_ID: ${{ steps.target.outputs.instance_id }}
        run: |
          set -euo pipefail
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "deploy staging ${GITHUB_RUN_ID}" \
            --parameters "commands=[\"sudo -u ec2-user IMAGE='$IMAGE' APP_ENVIRONMENT=staging HOST_PORT=8000 bash /home/ec2-user/deploy.sh\"]" \
            --query 'Command.CommandId' --output text)
          echo "SSM command: $CMD_ID"

          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query 'Status' --output text 2>/dev/null || echo "Pending")
            case "$STATUS" in
              Success) break ;;
              Failed|Cancelled|TimedOut) echo "::error::SSM command $STATUS"; break ;;
            esac
            sleep 5
          done

          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query 'StandardOutputContent' --output text
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query 'StandardErrorContent' --output text

          FINAL=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query 'Status' --output text)
          [ "$FINAL" = "Success" ]

      - name: Smoke test staging
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          BODY=$(curl -fsS --retry 10 --retry-delay 2 --retry-all-errors "http://$DEPLOY_HOST:8000/health")
          echo "$BODY"
          echo "$BODY" | grep -q '"status":"ok"'
          curl -fsS -X POST "http://$DEPLOY_HOST:8000/quote" \
            -H 'Content-Type: application/json' \
            -d '{"weight_kg": 10, "tier": "express"}' | grep -q '"cost":150.0'
  
  verify:
    name: Verify image signature
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      id-token: write
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@v4

      - name: Verify the image was signed by this repository's workflow
        env:
          IMAGE: ${{ needs.resolve.outputs.image }}
        run: |
          set -euo pipefail
          cosign verify "$IMAGE" \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/.github/workflows/.*" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            > /dev/null
          echo "Signature verified for $IMAGE"

  production:
    name: Deploy to production
    needs: [resolve, staging, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: http://${{ vars.DEPLOY_HOST }}/health
    steps:
      - name: Decode actual OIDC token claims
        run: |
          TOKEN=$(curl -sH "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')TOKEN=$(curl -sH "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')TOKEN=$(curl -sH "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          echo "$TOKEN" | cut -d '.' -f2 | base64 -d 2>/dev/null | jq '{sub, aud, repository, ref, environment}'
          
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-deploy-${{ github.run_id }}

      - name: Confirm who we are
        run: aws sts get-caller-identity

      - name: Find the instance by tag
        id: target
        run: |
          set -euo pipefail
          ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Project,Values=shipping-service" \
                      "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)
          if [ "$ID" = "None" ] || [ -z "$ID" ]; then
            echo "::error::No running instance tagged Project=shipping-service"
            exit 1
          fi
          echo "instance_id=$ID" >> "$GITHUB_OUTPUT"
          echo "Target instance: $ID"

      - name: Deploy over SSM (no inbound SSH)
        env:
          IMAGE: ${{ needs.resolve.outputs.image }}
          INSTANCE_ID: ${{ steps.target.outputs.instance_id }}
        run: |
          set -euo pipefail
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "deploy ${GITHUB_RUN_ID}" \
            --parameters "commands=[\"sudo -u ec2-user IMAGE='$IMAGE' APP_ENVIRONMENT=production bash /home/ec2-user/deploy-bluegreen.sh\"]" \
            --query 'Command.CommandId' --output text)
          echo "SSM command: $CMD_ID"

          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query 'Status' --output text 2>/dev/null || echo "Pending")
            case "$STATUS" in
              Success) break ;;
              Failed|Cancelled|TimedOut) echo "::error::SSM command $STATUS"; break ;;
            esac
            sleep 5
          done

          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query 'StandardOutputContent' --output text
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query 'StandardErrorContent' --output text

          FINAL=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query 'Status' --output text)
          [ "$FINAL" = "Success" ]

      - name: Smoke test
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          BODY=$(curl -fsS --retry 10 --retry-delay 2 --retry-all-errors "http://$DEPLOY_HOST/health")
          echo "$BODY"
          echo "$BODY" | grep -q '"environment":"production"'

      - name: Record what shipped 
        env:
         IMAGE: ${{ needs.resolve.outputs.image }}
        run: |
          {
            echo "### Shipped to production"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Image | \`$IMAGE\` |"
            echo "| Actor | ${{ github.actor }} |"
            echo "| Run | ${{ github.run_id }} |"
          } >> "$GITHUB_STEP_SUMMARY"
