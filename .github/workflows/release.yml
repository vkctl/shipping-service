name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: "v3.12"

      - name: Install tooling
        run: pip install --require-hashes -r requirements-dev.txt

      - name: Verify the tag point at head
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          DESCRIBED=$(git describe --tags --exact-match 2>/dev/null || echo "")
          if [ "$DESCRIBED" != "$TAG" ]; then
            echo "::error::Tag $TAG does not point at HEAD (descibed as '$DESCRIBED')"
            exit 1
          fi
          echo "Building release $TAG"

      - name: Run tests
        run: |
          pip install -e . --no-deps
          pytest -q

      - name: Build
        run: bash scripts/build.sh

      - name: Publish Github Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
          dist/*.whl dist/*.tar.gz dist/SHA256SUMS dist/build-info.json \
          --title "${GITHUB_REF_NAME}" \
          --generate-notes
