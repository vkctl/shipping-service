[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "shipping-service"
dynamic = ["version"]
description = "Calculates shipping cost by weight and service tier"
requires-python = ">=3.9"
dependencies = [
    "flask==3.0.3",
    "gunicorn==22.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "build==1.2.2",
    "requests==2.33.0"
]

[project.scripts]
shipping = "shipping.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
version_file = "src/shipping/_version.py"